server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS. Looking the gateway up through a variable means nginx starts even if the gateway
    # does not exist yet, and still finds it after the container is recreated with a new address.
    resolver 127.0.0.11 valid=10s;
    set $gateway http://gateway:8080;
    # A gateway that just went away must fail fast, or the browser's reconnect hangs for the default 60 s.
    proxy_connect_timeout 5s;

    # The bundle shrinks to about a quarter. Level 6 instead of nginx's default 1 sends about 130 KB
    # less on a first visit, for a few milliseconds of CPU. gzip_proxied: a proxy in front adds a Via
    # header, which would otherwise turn compression off.
    gzip on;
    gzip_comp_level 6;
    gzip_types application/javascript text/css image/svg+xml application/json;
    gzip_proxied any;

    # Unknown paths get the app, so that deep links such as /console work.
    location / {
        try_files $uri /index.html;
    }

    # WebSocket to the gateway. The Upgrade/Connection headers are required, and buffering must be
    # off or nginx would hold small frames back and hide the latency we are trying to show.
    location = /ws {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass $gateway;
    }
}
